# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: Jaret
middle_name:
last_name: Arnold
contact_note: > #
# Shipped in <meta name="description">, og:description, twitter:description AND the
# JSON-LD blob (see _includes/metadata.liquid:42,60,69,238) on EVERY page. It was empty
# until 2026-07-29, and `keywords` below still advertised the al-folio THEME.
#
# CORRECTION to what this comment first said: the empty description was NOT why link
# previews had no summary. og:/twitter: tags are gated on serve_og_meta, which was false —
# they were not emitted at all, empty description or not. Verified by fetching the live
# page after filling this in and finding og:description still absent. Both flags are now
# on; see the Open Graph section below.
#
# metadata.liquid interpolates this raw into an HTML attribute and into JSON — so no
# double quotes and no bare ampersands here, or the JSON-LD breaks. Hence "and".
description: >
  PhD student in Genetics, Bioinformatics and Computational Biology at Virginia Tech,
  working on computer vision and machine learning for plant science and on open-source
  tooling for plant genomics.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
  Photos from <a href="https://unsplash.com" target="_blank">Unsplash</a>.
keywords: plant science, bioinformatics, computational biology, computer vision, machine learning, plant genomics, synthetic biology, phenotyping, Model Context Protocol, Virginia Tech
lang: en # the language of your site (for example: en, fr, cn, ru, etc.)
icon: 🧬 # the emoji used as the favicon (alternatively, provide image name in /assets/img/)

url: https://musharna.github.io # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /blog/. Leave blank for root
last_updated: false # set to true if you want to display last updated in the footer
impressum_path: # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR
back_to_top: true # set to false to disable the back to top button

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# repo_theme_light / repo_theme_dark / repo_trophies REMOVED: they configured
# _includes/repository/*, which was only ever rendered by the al-folio /repositories/ page.
# That page was deleted, orphaning the includes and _data/repositories.yml (which listed
# torvalds and alshedivat), so all of it is gone. Live config for a deleted feature reads
# as a feature that exists.

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
# will use title and url fields
# Take a look to https://github.com/jekyll/jekyll-feed for more customization

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true

# Dimensions
max_width: 930px

# TODO: add layout settings (single page vs. multi-page)

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
# see https://schema.org/docs/faq.html for more information
# Both ENABLED 2026-07-29. The whole OpenGraph + Twitter-card block in
# _includes/metadata.liquid:54 is gated on serve_og_meta, so with it false the site emitted
# no og:title, og:description, og:image or twitter:card at all — every link to this site
# rendered as a bare URL on Slack, LinkedIn, Bluesky and Discord. Filling site.description
# alone did NOT fix that; the flag is the actual cause.
serve_og_meta: true # Include Open Graph meta tags in the HTML head
# Emits a Person JSON-LD with sameAs links built from _data/socials.yml (GitHub, ORCID).
# The 'email' case in that generator is deliberately commented out upstream, so the address
# is NOT published in structured data. Depends on socials.yml only — nothing it needs was
# removed with the demo data.
serve_schema_org: true # Include Schema.org in the HTML head
# Must be ABSOLUTE: metadata.liquid:62 interpolates this raw into og:image with no
# absolute_url filter, and the OpenGraph spec requires a fully-qualified URL — a site-root
# path silently yields a preview with no image.
og_image: https://musharna.github.io/assets/img/prof_pic.jpg

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

# For Google Analytics, see https://support.google.com/analytics/answer/10447272?hl=en&ref_topic=14088998&sjid=5129943941510317771-SA#zippy=%2Cgoogle-sites
# and follow the instructions for Google Sites. You will need to create a Google Analytics property and copy the Google tag ID.
google_analytics: # your Google Analytics measurement ID (format: G-XXXXXXXXXX)
cronitor_analytics: # cronitor RUM analytics site ID (format: XXXXXXXXX)
pirsch_analytics: # your Pirsch analytics site ID (length 32 characters)
openpanel_analytics: # your Openpanel analytics client ID (format: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX)

# For Google Search Console, see https://support.google.com/webmasters/answer/9008080?hl=en#meta_tag_verification&zippy=%2Chtml-tag
google_site_verification: # your google-site-verification ID (Google Search Console)
bing_site_verification: # out your bing-site-verification ID (Bing Webmaster)

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: al-folio # blog_name will be displayed in your blog page
blog_description: a simple whitespace theme for academics
permalink: /blog/:year/:title/
lsi: false # produce an index for related posts

# Pagination
pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# Giscus comments (RECOMMENDED)
# Follow instructions on https://giscus.app/ to setup for your repo to fill out the information below.
giscus:
  repo: # <your-github-user-name>/<your-github-repo-name>
  repo_id: # leave empty or specify your repo_id (see https://giscus.app/)
  category: Comments # name of the category under which discussions will be created
  category_id: # leave empty or specify your category_id (see https://giscus.app/)
  mapping: title # identify discussions by post title
  strict: 1 # use strict identification mode
  reactions_enabled: 1 # enable (1) or disable (0) emoji reactions
  input_position: bottom # whether to display input form below (bottom) or above (top) the comments
  dark_theme: dark # name of the dark color scheme (preferred works well with al-folio dark mode)
  light_theme: light # name of the light color scheme (preferred works well with al-folio light mode)
  emit_metadata: 0
  lang: en

# Disqus comments (DEPRECATED)
# Was `al-folio` — the upstream template's own shortname. Cleared so comments could
# never be routed to someone else's Disqus if this were ever re-enabled.
disqus_shortname: # put your disqus shortname
# https://help.disqus.com/en/articles/1717111-what-s-a-shortname

# External sources.
# If you have blog posts published on medium.com or other external sources,
# you can display them in your blog by adding a link to the RSS feed.
#
# EMPTIED. This shipped pointing at al-folio's OWN Medium feed plus a Google Blog
# announcement, and it generated four live, sitemap-indexed pages under my name:
#   /blog/2022/displaying-external-posts-on-your-al-folio-blog/
#   /blog/2024/google-gemini-updates-flash-15-gemma-2-and-project-astra/
#   /blog/2022/  /blog/2024/
# Excluding _pages/blog.md and _posts/ did NOT stop this — the posts are generated
# from external_sources, not from _posts. Same mechanism as the books collection:
# removing an index page does not stop the content that feeds it.
external_sources:

# -----------------------------------------------------------------------------
# Newsletter
# -----------------------------------------------------------------------------

newsletter:
  enabled: false
  endpoint: # your loops endpoint (e.g., https://app.loops.so/api/newsletter-form/YOUR-ENDPOINT)
  # https://loops.so/docs/forms/custom-form

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  books:
    # al-folio ships a demo book review (The Godfather, with a fabricated reading
    # log and a buy link). Deleting _pages/books.md only removed the index — the
    # COLLECTION kept generating /books/the_godfather/, /books/category/crime/,
    # /books/tag/top-100/ and 6 more, all returning 200 and all listed in
    # sitemap.xml. Output disabled and the demo content deleted.
    output: false
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ["_pages", "_scripts"]
exclude:
  - bin/
  # CONTRIBUTING.md is DELETED, not excluded: GitHub wires that filename into its own
  # issue/PR UI regardless of Jekyll, so al-folio's "Contributing to al-folio" guide was
  # being offered to anyone opening a PR on THIS repo. Excluding it from the build never
  # touched that surface.
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  # LICENSE stays: al-folio is MIT, and retaining its copyright notice is a condition of
  # the licence, not leftover residue. Do not delete it.
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  # readme_preview/ DELETED: 14 screenshots (3.3 MB) of al-folio's own demo site, used
  # only by the template's README, which this repo no longer carries.
  - vendor
  #Additions beyond template:
  # _bibliography/ and publications.md are NO LONGER excluded — the page now
  # carries the four Zenodo-archived software entries (concept DOIs).
  # teaching/repositories/profiles/books/dropdown were unedited al-folio template
  # pages; they are DELETED rather than excluded, so their placeholder text
  # ("Replace this text with your description", "your own GitHub profile") cannot
  # resurface if an exclude line is ever dropped. books.md proved the point: it was
  # never excluded, so /books/ was serving al-folio's demo bookshelf publicly and
  # was listed in sitemap.xml.
  - _news/announcement_*.md
  - _pages/news.md
  - _pages/blog.md
  # _posts/ (31 al-folio feature-demo posts) and assets/jupyter/blog.ipynb are DELETED,
  # not excluded — same reasoning as the template pages above. Excluding them kept ~45 MB
  # of demo images, video and audio in the repo that ONLY those posts referenced.
  - _news/
  # _pages/cv.md stays excluded, and BOTH of its data sources are deleted. There were two,
  # and both held al-folio's Albert Einstein demo CV:
  #   assets/json/resume.json  - the primary. Because assets/ is copied verbatim this one
  #                              was LIVE at /assets/json/resume.json (HTTP 200, complete
  #                              with albert@einstein.de) even though /cv/ was never built.
  #                              Excluding a page does not unpublish its assets.
  #   _data/cv.yml             - the fallback (_layouts/cv.liquid:4 falls through to it when
  #                              site.data.resume is empty). Not web-served, but it meant
  #                              simply dropping this exclude line would have published an
  #                              Einstein CV rather than an empty one.
  # With both gone, un-excluding cv.md renders an empty CV — wrong-and-obvious beats
  # wrong-and-plausible. To build a real one: add your own _data/cv.yml, or recreate
  # assets/json/resume.json and restore the jekyll_get_json / jsonresume blocks near the
  # bottom of this file.
  - _pages/cv.md
  #WIP Projects:
  - _projects/Agrigen.md
  - _projects/PhelipancheTranscriptomics.md

keep_files:
  - CNAME
  - .nojekyll

# Plug-ins
plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false # set to false since we are using terser as the js minifier
  exclude: ["robots.txt", "assets/js/search/*.js"]

# -----------------------------------------------------------------------------
# Terser
# -----------------------------------------------------------------------------

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"
  books:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).

display_tags: ["formatting", "images", "links", "math", "code", "blockquotes"] # these tags will be displayed on the front page of your blog
display_categories: ["external-services"] # these categories will be displayed on the front page of your blog

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Einstein]
  first_name: [Albert, A.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# Display different badges withs stats for your publications
# Customize badge behavior in _layouts/bib.liquid
enable_publication_badges:
  altmetric: true # Altmetric badge (Customization options: https://badge-docs.altmetric.com/index.html)
  dimensions: true # Dimensions badge (Customization options: https://badge.dimensions.ai/)
  google_scholar: true # Google Scholar badge (https://scholar.google.com/intl/en/scholar/citations.html)
  inspirehep: true # Inspire HEP badge (https://help.inspirehep.net/knowledge-base/citation-metrics/)

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    google_scholar_id,
    html,
    inspirehep_id,
    pdf,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

# Maximum number of authors to be shown for each publication (more authors are visible on click)
max_author_limit: 3 # leave blank to always show all authors
more_authors_animation_delay: 10 # more authors are revealed on click using animation; smaller delay means faster animation

# Enables publication thumbnails. If disabled, none of the publications will display thumbnails, even if specified in the bib entry.
enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

# These are the defaults
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

# MAKE SURE imagemagick is installed and on your PATH before enabling imagemagick. In a terminal, run:
#   convert -version
imagemagick:
  enabled: true # enables responsive images for your site (recommended, see https://github.com/alshedivat/al-folio/issues/537)
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-quality 85"

# Lazy loading images
#   If you enable lazy loading, all images will add the loading="lazy" attribute.
#   This will make your site load faster, but it may not be supported in all browsers.
#   You can also set loading="" to other values for specific images to override the default behavior.
#   Options: "auto", "eager", "lazy"
#   See https://web.dev/browser-level-image-lazy-loading/ for more information.
lazy_loading_images: true # enables lazy loading of images (recommended)

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false # enables google analytics
enable_cronitor_analytics: false # enables cronitor RUM analytics
enable_pirsch_analytics: false # enables Pirsch analytics (https://pirsch.io/)
enable_openpanel_analytics: false # enables Openpanel analytics (https://openpanel.dev/)
enable_google_verification: false # enables google site verification
enable_bing_verification: false # enables bing site verification
enable_masonry: true # enables automatic project cards arrangement
enable_math: true # enables math typesetting (uses MathJax)
enable_tooltips: false # enables automatic tooltip links generated for each section titles on pages and posts
enable_darkmode: true # enables switching between light/dark modes
enable_navbar_social: false # enables displaying social links in the navbar on the about page
enable_project_categories: true # enables categorization of projects into multiple categories
enable_medium_zoom: true # enables image zoom feature (as on medium.com)
enable_progressbar: true # enables a horizontal progress bar linked to the vertical scroll position
enable_video_embedding: false # enables video embedding for bibtex entries. If false, the button opens the video link in a new window.

