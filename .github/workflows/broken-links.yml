name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    # INERT ON THIS FORK, DELIBERATELY. This condition is upstream's; on
    # musharna/musharna.github.io it can never be true, which is why every run of
    # this workflow shows "skipped". Leaving it inert rather than enabling it:
    # it scans SOURCE .md, where Liquid is unresolved, so `{{ '/x' | relative_url }}`
    # reports as a missing file. Measured on _projects/: 9 errors, all Liquid, zero
    # real. broken-links-site.yml supersedes it — same checker, run against the BUILT
    # site where Liquid is resolved, and now with external checking enabled.
    if: github.repository == 'alshedivat/al-folio'
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          # removed md files that include liquid tags
          args: --user-agent 'curl/7.54' --exclude-path README.md --exclude-path _pages/404.md --exclude-path _pages/blog.md --exclude-path _posts/2018-12-22-distill.md --exclude-path _posts/2023-04-24-videos.md --exclude-path _books/the_godfather.md --verbose --no-progress './**/*.md' './**/*.html'
