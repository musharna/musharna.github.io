name: Content guards

# Guards failure modes the existing checks cannot see. Both share one runner:
# each is a few seconds of stdlib Ruby, and a second workflow would spend more
# Actions time on checkout than on checking.
#
# 1. FRONT MATTER
#
# Jekyll does not error on unparseable YAML front matter -- it discards the
# front matter and builds the file anyway. The page then deploys with no
# layout AND disappears from its collection, while still returning HTTP 200.
# So the link checker passes, the a11y sweep passes, and the deploy is green.
#
# That is not hypothetical: `_projects/MCPServers.md` shipped that way from an
# unquoted colon in its description, which left the "research tooling" heading
# on /projects/ rendering over an empty card row.
#
# 2. BIBLIOGRAPHY COVERAGE
#
# /publications/ filters its {% bibliography %} by author, so it renders only
# the entry TYPES it explicitly names. Adding a peer-reviewed @article without
# adding a query for it means the paper never appears -- green build, no error,
# and a skipped section looks exactly like an absent one.
#
# 3. LIQUID IN HTML COMMENTS
#
# Liquid runs before the HTML is parsed, so `<!-- ... -->` does not make a tag
# inert. A tag quoted inside a comment as documentation is EXECUTED and its
# output lands in the page, while the comment markers keep the explanation
# invisible. That is how a comment on publications.md describing the new author
# filter silently re-rendered the whole unfiltered bibliography beneath it.
#
# 4. CORRECTED CLAIMS STILL LIVE OFF-SITE
#
# Every other guard here stops at the repository boundary. A reader does not:
# they click through to the GitHub README, the model card, the demo. On
# 2026-08-08 the OrchidCLIP page was corrected to stop calling its holdout
# "stratified" and to lead with the per-genus average -- and both retracted
# claims stayed live for a day on the two surfaces that page links to, one of
# them understating the result by half. Nothing could see it, because nothing
# in CI had ever read those surfaces.
#
# The scope of a correction is the CLAIM, not the file. bin/retractions.json is
# the ledger of what has been corrected; the check fails if a retracted string
# survives anywhere, and equally if the REPLACEMENT text is missing -- that
# second half is a positive control, without which an empty fetch reads as
# "retracted text absent" and passes having observed nothing.
#
# This step needs network (raw.githubusercontent.com, huggingface.co) and
# retries three times before giving up. An unreachable surface fails the build
# rather than warning: a surface you publish claims on that cannot be read is
# itself worth knowing about, and a guard that degrades to a warning is a guard
# that stops being read.
#
# Deliberately NOT path-filtered. deploy.yml filters paths, which is fine for a
# build, but a filtered guard cannot fire on the pull request that introduces
# it -- the check would merge having never run once.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-guards:
    name: Content guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No setup-ruby: the runner image ships Ruby, and these need only the
      # stdlib -- YAML (Psych) is the same parser Jekyll uses, so the check
      # agrees with the build by construction rather than by approximation.
      - name: Check every content file's front matter
        run: ruby bin/check-front-matter.rb
      # Runs even if the front-matter check fails, so one PR reports both
      # problems instead of revealing the second only after fixing the first.
      - name: Check every authored entry is rendered on /publications/
        if: always()
        run: ruby bin/check-bibliography.rb
      - name: Check no HTML comment hides a live Liquid tag
        if: always()
        run: ruby bin/check-liquid-in-comments.rb
      # Python, not Ruby, because this one fetches: stdlib urllib only, and the
      # runner image ships python3, so it still needs no setup step.
      - name: Check no corrected claim is still live on a linked surface
        if: always()
        run: python3 bin/check-claim-consistency.py
