name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]
  # A change to THIS file cannot trigger this workflow. deploy.yml's paths filter
  # negates '.github/workflows/broken-links-site.yml', and this job only runs on
  # Deploy site completing — so a commit touching only the link checker deploys
  # nothing and therefore checks nothing. Two fixes to the exclusion list below
  # (PR #57, PR #58) merged green without the check ever re-running; the second
  # was only discovered to be needed because an UNRELATED content push happened
  # to redeploy. Manual dispatch makes a fix to this workflow verifiable on its
  # own, instead of waiting for someone to edit a page.
  workflow_dispatch:

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    # The workflow_run guard must not swallow manual runs: on a workflow_dispatch
    # event github.event.workflow_run is null, so the bare conclusion check is
    # false and the job would silently SKIP — reporting success without checking
    # a single link.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Must match deploy.yml. This workflow sat on 3.2.2 while deploy.yml moved
          # to 3.3.5, and css_parser 3.0.0 (a transitive dep) now requires >= 3.3 —
          # so `bundle install` exited 5 and this job reported RED for a dependency
          # failure, not for broken links. It had never actually checked a link.
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        # Pinned: @main is a floating branch ref — whatever lands there runs here.
        uses: fjogeleit/yaml-update-action@v0.17.0
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          # Only check local links. --root-dir is what lets lychee resolve
          # root-relative hrefs ('/', '/projects/', '/assets/...'); without it every
          # one of them is an unresolvable error. The first time this job ever got
          # past `bundle install` (2026-07-28) it reported 159 errors, all of that
          # class — zero were real. The old --remap covered /assets only, not pages.
          #
          # Measured on a local build, same _site:
          #   without --root-dir : 159 errors, 11 OK, 52 unique
          #   with    --root-dir :   0 errors, 170 OK, 109 unique
          # Coverage roughly DOUBLES — this resolves links rather than silencing them.
          # Detection is intact: an injected '/definitely-not-real-9f3a/' is still
          # flagged while a valid sibling link passes.
          #
          # --offline REMOVED. This runs on the BUILT site, where Liquid is already
          # resolved, so it is the only place external links can be checked without
          # false-positiving on `{{ ... | relative_url }}` (which is exactly what
          # broken-links.yml hits when it scans source .md). While it was offline,
          # NOTHING on this site checked an external URL — which is how a link to a
          # PRIVATE HuggingFace model (401) shipped on two project pages.
          # Verified: this config flags that 401 and passes the public sibling.
          # Measured full run ~1m30s. Tuning below is from the FIRST online run,
          # which went red on things that were provably healthy:
          #   --timeout 45      doi.org -> zenodo redirect chains exceeded the 20s
          #                     default and reported TIMEOUT on all four DOIs. All
          #                     four return 200 to curl. Real links, slow resolver.
          #   --retry-wait-time 2
          # Exclusions are for hosts that reject non-browser agents, NOT for links
          # that are actually down — each verified 200 via curl before excluding:
          #   unsplash.com  401s every non-browser UA (al-folio image credit)
          #   hf.space      resets lychee's UA (connection reset by peer) while
          #                 returning 200 to curl. The canonical
          #                 huggingface.co/spaces/... URL is still checked, so the
          #                 private-model 401 class of defect remains covered.
          # The two DOI prefixes below differ from the two exclusions above: they
          # CANNOT be verified 200 via curl, because doi.org resolves them to
          # publisher landing pages that 403 every non-browser agent, curl included.
          # Each was verified against a metadata registry instead, which is
          # authoritative for the record even when the landing page is not reachable.
          # All 8 DOIs on the site were tested at once rather than one per red build:
          # 6 return 200, these 2 return 403, and both 403s are publisher bot-blocks.
          #   10.15468/dl.  GBIF occurrence downloads -> www.gbif.org [403].
          #                 api.gbif.org/v1/occurrence/download/0014785-240202131308920
          #                 returns status SUCCEEDED, doi 10.15468/dl.5gavr9, 452 records.
          #   10.1071/      CSIRO / Functional Plant Biology -> connectsci.au [403].
          #                 CrossRef returns Nicotra et al., "The evolution and functional
          #                 significance of leaf shape in the angiosperms", Functional
          #                 Plant Biology 38: 535-552 (2011). The DOI resolves; the
          #                 landing page blocks bots.
          # Re-measured 2026-08-02 against a local production build of this commit
          # (al-folio image to build, lycheeverse/lychee image to check, args as below):
          #   388 links, 168 unique, 358 OK, 0 ERRORS, 19 excluded.
          # An earlier revision of this line claimed "231 OK, 0 errors". That figure is
          # NOT reproducible and predates the current page set — replaced with measured.
          # Control, same build: injecting '/definitely-not-real-9f3a/' into a built page
          # gives 1 ERROR and exit 2, while the 25 real links on that page still pass.
          # So the 0 above means the check RAN and found nothing, not that it is inert.
          args: --root-dir "$GITHUB_WORKSPACE/_site" --user-agent 'curl/7.54' --max-concurrency 4 --max-retries 3 --timeout 45 --retry-wait-time 2 --exclude 'unsplash\.com' --exclude 'hf\.space' --exclude '10\.15468/dl\.' --exclude '10\.1071/' --verbose --no-progress '_site/**/*.html'
