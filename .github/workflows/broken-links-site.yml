name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Must match deploy.yml. This workflow sat on 3.2.2 while deploy.yml moved
          # to 3.3.5, and css_parser 3.0.0 (a transitive dep) now requires >= 3.3 —
          # so `bundle install` exited 5 and this job reported RED for a dependency
          # failure, not for broken links. It had never actually checked a link.
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        # Pinned: @main is a floating branch ref — whatever lands there runs here.
        uses: fjogeleit/yaml-update-action@v0.17.0
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          # Only check local links. --root-dir is what lets lychee resolve
          # root-relative hrefs ('/', '/projects/', '/assets/...'); without it every
          # one of them is an unresolvable error. The first time this job ever got
          # past `bundle install` (2026-07-28) it reported 159 errors, all of that
          # class — zero were real. The old --remap covered /assets only, not pages.
          #
          # Measured on a local build, same _site:
          #   without --root-dir : 159 errors, 11 OK, 52 unique
          #   with    --root-dir :   0 errors, 170 OK, 109 unique
          # Coverage roughly DOUBLES — this resolves links rather than silencing them.
          # Detection is intact: an injected '/definitely-not-real-9f3a/' is still
          # flagged while a valid sibling link passes.
          #
          # --offline REMOVED. This runs on the BUILT site, where Liquid is already
          # resolved, so it is the only place external links can be checked without
          # false-positiving on `{{ ... | relative_url }}` (which is exactly what
          # broken-links.yml hits when it scans source .md). While it was offline,
          # NOTHING on this site checked an external URL — which is how a link to a
          # PRIVATE HuggingFace model (401) shipped on two project pages.
          # Verified: this config flags that 401 and passes the public sibling.
          # Measured full run ~1m15s. unsplash.com is excluded because it 401s all
          # non-browser agents (al-folio's default image-credit link, not a defect).
          args: --root-dir "$GITHUB_WORKSPACE/_site" --user-agent 'curl/7.54' --max-concurrency 4 --max-retries 3 --exclude 'unsplash\.com' --verbose --no-progress '_site/**/*.html'
