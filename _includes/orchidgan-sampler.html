<div class="orchidgan-card">
  <div class="orchidgan-head">
    <h2 class="orchidgan-title">Interactive sampler</h2>
    <p class="orchidgan-sub">Browse pre-generated OrchidGAN samples (seeds 0–499).</p>
  </div>

  <div class="orchidgan-controls">
    <label class="orchidgan-label" for="orchidgan-seed">
      Seed
      <input id="orchidgan-seed" class="orchidgan-input" type="number" min="0" max="499" step="1" value="18" />
    </label>

    <div class="orchidgan-buttons">
      <button id="orchidgan-load" class="orchidgan-btn" type="button">Load</button>
      <button id="orchidgan-random" class="orchidgan-btn orchidgan-btn-primary" type="button">Random</button>
    </div>

    <div id="orchidgan-status" class="orchidgan-status" aria-live="polite"></div>
  </div>

  <figure class="orchidgan-figure">
    <img id="orchidgan-img" class="orchidgan-img" src="/assets/img/orchidgan/samples/seed_0018.webp" alt="OrchidGAN generated orchid sample" />
    <figcaption id="orchidgan-caption" class="orchidgan-caption">seed_0018.webp</figcaption>
  </figure>
</div>

<link rel="stylesheet" href="/assets/css/orchidgan.css" />
<script src="/assets/js/orchidgan-sampler.js"></script>

<h2>Latent interpolation</h2>
<p style="opacity: 0.78; margin-top: -6px">Smooth transitions between two seeds.</p>

<video class="orchidgan-video" autoplay controls muted loop playsinline preload="metadata">
  <source src="/assets/video/orchidgan/interp/interp_0018_0042.mp4" type="video/mp4" />
</video>
<p class="orchidgan-caption">seed 18 → seed 42</p>

<h2>Style mixing</h2>
<p style="opacity: 0.78; margin-top: -6px">Rows control global structure; columns control fine details.</p>

<img class="orchidgan-img" src="/assets/img/orchidgan/stylemix/grid.png" alt="Style mixing grid" />
