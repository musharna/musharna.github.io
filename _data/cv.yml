    - <a href="https://doi.org/10.5281/zenodo.21713870">phylokit-mcp</a> — phylogenetic inference that never returns a topology without its support
    - <a href="https://doi.org/10.5281/zenodo.21713210">breedsim-mcp</a> — breeding-scheme simulation returning distributions rather than single runs
    - <a href="https://doi.org/10.5281/zenodo.21789280">Taxon3D</a> — blind comparison benchmark for generative 3D models of organisms
    - <a href="https://doi.org/10.5281/zenodo.21636354">ghostcite</a> — deterministic detection of ghost citations and retracted references
    - <a href="https://doi.org/10.5281/zenodo.21636369">jobd</a> — self-hostable GPU-aware job broker with agent (MCP) integration
